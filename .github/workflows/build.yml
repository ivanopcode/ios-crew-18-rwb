name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: Static HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint frontmatter
        run: npm run lint

      - name: Build static SPA
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: slides-html
          path: dist/
          retention-days: 90
          if-no-files-found: error

  pdf:
    name: PDF export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Headless Chromium is only needed in CI, so it stays out of the lockfile.
      - name: Install headless Chromium
        run: npm install --no-save playwright-chromium

      - name: Export PDF
        run: npm run export

      - uses: actions/upload-artifact@v7
        with:
          name: slides-pdf
          path: .temp/export/*.pdf
          retention-days: 90
          if-no-files-found: error

      # Every slide is rendered in Chromium and measured: flowing content
      # must stay above the source line, and the console must be clean.
      - name: Audit slide overflow
        run: |
          npm run build:offline
          python3 -m http.server 8093 --directory .temp/dist-offline >/dev/null 2>&1 &
          sleep 1
          node .scripts/audit-overflow.mjs http://localhost:8093/ .temp/audit slides.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slides-audit
          path: .temp/audit/
          retention-days: 30
          if-no-files-found: ignore
